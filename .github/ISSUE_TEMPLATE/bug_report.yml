name: Bug report
description: Report a reproducible Mumla problem without private recordings or transcripts.
body:
  - type: markdown
    attributes:
      value: |
        For security/privacy vulnerabilities, use [private reporting](https://github.com/simonbromander/Mumla/security/advisories/new), not this form. Redact user content, paths, and identifiers from diagnostics and screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform / distribution
      options:
        - iOS app
        - iOS keyboard
        - macOS direct download
        - macOS App Store / TestFlight
        - Local development build
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, OS version, and device
      placeholder: "Example: Mumla 1.0.1 (31), iOS 26.2, iPhone 17 Pro"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic text/audio. Include the focused app and relevant permissions for keyboard/hotkey/paste problems.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics or screenshots
      description: Optional. Do not upload private transcripts, recordings, keys, or unreviewed crash logs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private user content or credentials.
          required: true
