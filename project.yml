name: Mumla
configs:
  Debug: debug
  Release: release
  Direct: release
options:
  bundleIdPrefix: com.mumla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
packages:
  MumlaKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "28"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PF2PWR4YG4
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  MumlaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/MumlaUITests
    dependencies:
      - target: Mumla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mumla.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mumla
  MumlaMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/MumlaMac
      - path: Apps/macOS/Mumla/Resources
    dependencies:
      - package: MumlaKit
        product: MumlaCore
      - package: MumlaKit
        product: MumlaAudio
      - package: MumlaKit
        product: MumlaUI
    settings:
      base:
        PRODUCT_NAME: Mumla
        PRODUCT_BUNDLE_IDENTIFIER: com.mumla.app
        CURRENT_PROJECT_VERSION: "29"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Apps/macOS/Mumla/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Mumla/Mumla.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MUMLA_DISTRIBUTION: app-store
      configs:
        Direct:
          CODE_SIGN_ENTITLEMENTS: Apps/macOS/Mumla/MumlaDirect.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CURRENT_PROJECT_VERSION: "32"
          MUMLA_DISTRIBUTION: direct
  Mumla:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Mumla
    dependencies:
      - package: MumlaKit
        product: MumlaCore
      - package: MumlaKit
        product: MumlaAudio
      - package: MumlaKit
        product: MumlaUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mumla.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Apps/iOS/Mumla/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Mumla/Mumla.entitlements
schemes:
  Mumla:
    build:
      targets:
        Mumla: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - MumlaUITests
  MumlaMac:
    build:
      targets:
        MumlaMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MumlaMacDirect:
    build:
      targets:
        MumlaMac: all
    run:
      config: Direct
    profile:
      config: Direct
    analyze:
      config: Direct
    archive:
      config: Direct
