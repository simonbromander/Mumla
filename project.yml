name: Mumla
options:
  bundleIdPrefix: com.mumla
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "24"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PF2PWR4YG4
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  Mumla:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Mumla
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mumla.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Apps/iOS/Mumla/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/Mumla/Mumla.entitlements
    scheme:
      testTargets: []
schemes:
  Mumla:
    build:
      targets:
        Mumla: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
